databases:
  - name: brandslens-db
    plan: free

services:
  - type: web
    name: brandslens-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste this in Render's dashboard, not committed to git
      - key: DATABASE_URL
        fromDatabase:
          name: brandslens-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "*"           # tighten to your real frontend URL once you have one — see DEPLOY.md

  - type: worker
    name: brandslens-worker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.worker"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: brandslens-db
          property: connectionString
