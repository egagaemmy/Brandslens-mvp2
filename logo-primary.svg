<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap');
      .serif-brand { font-family: 'Instrument Serif', Georgia, serif; fill: #F8FAFC; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg)" />

  <!-- Centered Minimal Logo Lockup -->
  <g transform="translate(400, 260)">
    <!-- Sentinel Shield Mark -->
    <g transform="translate(0, -40)">
      <path d="M 0 -70 C 35 -70 60 -52 60 -20 C 60 25 18 58 0 70 C -18 58 -60 25 -60 -20 C -60 -52 -35 -70 0 -70 Z" 
            fill="none" stroke="url(#amberGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -35 -12 C -18 -32 18 -32 35 -12 C 18 8 -18 8 -35 -12 Z" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="4 3" />
      <path d="M -16 -32 C 8 -18 8 14 -16 30 C -35 14 -35 -18 -16 -32 Z" fill="none" stroke="#94A3B8" stroke-width="2.5" opacity="0.7" />
      <circle cx="0" cy="-12" r="7" fill="#EF4444" filter="url(#redGlow)" />
    </g>

    <!-- Pure Wordmark -->
    <g transform="translate(0, 90)">
      <text x="0" y="0" text-anchor="middle" class="serif-brand" font-size="68">
        Brands<tspan font-style="italic" fill="#F59E0B">Lens</tspan>
      </text>
    </g>
  </g>
</svg>
